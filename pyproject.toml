[project]
name = "betterchat"
version = "0.2.0"
description = "BetterChat: a customizable Kick chat viewer (static site) plus its admin/stats server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
betterchat = "betterchat.main:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["betterchat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
