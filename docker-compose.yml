# BetterChat in Docker on this machine, for trying the image as it ships:
#
#   cp .env.example .env          # ADMIN_USER / ADMIN_PASSWORD
#   docker compose up -d --build  # http://localhost:8010 (or your HOST_PORT)
#
# Production and dev are deployed with Kamal and deploy-kit instead
# (config/deploy*.yml, README "Deploying"); nothing there reads this file.
services:
  betterchat:
    build: .
    image: betterchat:local
    restart: unless-stopped
    ports:
      # HOST_PORT (from .env) on the host -> 8010 inside the container.
      - "${HOST_PORT:-8010}:8010"
    env_file:
      - .env
    environment:
      # The container always listens on 8010 (Dockerfile EXPOSE + healthcheck);
      # this wins over a PORT= line in .env meant for `uv run betterchat`.
      PORT: "8010"
    volumes:
      - betterchat-data:/app/data

volumes:
  betterchat-data:
