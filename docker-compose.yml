# BetterChat on a homelab, published through Cloudflare Tunnel.
#
#   cp .env.example .env          # ADMIN_USER / ADMIN_PASSWORD
#   docker compose up -d --build
#   tunnel: betterchat.tech -> http://localhost:8010   (or your HOST_PORT)
#
# The same file runs the production instance and the dev one, from separate
# checkouts on the same host. Three things in .env keep them apart:
# COMPOSE_PROJECT_NAME (container and volume names), IMAGE_TAG (below) and
# HOST_PORT. Read by compose from the .env beside this file.
services:
  betterchat:
    build: .
    # Tagged per instance. With a fixed tag, building dev would move the tag
    # production's next restart resolves, and production would quietly come
    # back up on dev's code.
    image: betterchat:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      # HOST_PORT (from .env) on the host -> 8010 inside the container.
      - "${HOST_PORT:-8010}:8010"
    env_file:
      - .env
    environment:
      # The container always listens on 8010 (Dockerfile EXPOSE + healthcheck);
      # this wins over a PORT= line in .env meant for `uv run betterchat`.
      PORT: "8010"
    volumes:
      - betterchat-data:/app/data

volumes:
  betterchat-data:
