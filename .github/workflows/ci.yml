name: CI

# CI tests, and for pushes to master and dev builds the image and attests where it came from. It deploys nothing and
# holds no SSH key or app secret: a person deploys with deploy-kit, which checks this run passed for the exact commit
# (production only) and verifies the image's attestation (README, "Deploying").
on:
  push:
    branches: [master, dev]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Astral's own installer rather than a third-party action, so there is no action version to keep an eye on.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Server tests
        run: uv run --frozen pytest -q

      # package.json has no dependencies - these are node --check and node --test - so there is nothing to install.
      - name: Frontend syntax and unit tests
        run: |
          npm run check
          npm test

  # Only for pushes to master or dev. Deliberately not `needs: test`: dev deploys don't wait for green, so its image
  # can't either. Production does wait, through the kit's ci-green gate, which needs every job here to have passed.
  # The image is tagged with the full commit SHA, which is the version Kamal deploys; one image serves both
  # destinations.
  image:
    name: Build and push image
    if: github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push to GHCR with the job's own token
      id-token: write # sign the provenance (Sigstore, keyless)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GHCR names are lower case. Must match `image:` in config/deploy.yml and KIT_IMAGE in .kamal/kit.env.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # Kamal only runs images labelled with its service: `service:` in config/deploy.yml.
          labels: service=betterchat
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ github.ref_name }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ github.ref_name }},mode=max
      # Checked before every deploy (the kit's attestation step): an image this workflow didn't build is refused.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
