# Push to master -> tests on GitHub's runners -> deploy to production.
#
# master is the stable branch: it is the only thing that reaches
# betterchat.tech, and it only gets there if the tests pass. Day-to-day work
# goes to the dev branch and its own instance (deploy-dev.yml), which cannot
# touch this one.

name: Deploy

on:
  push:
    branches: [master]
  # Lets you redeploy the current master from the Actions tab without a push.
  workflow_dispatch:

# One deploy at a time. A push landing mid-build waits for it rather than
# cancelling it: a half-finished "compose up" is not something to leave behind.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Astral's own installer rather than a third-party action, so there is
      # no action version to keep an eye on.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Server tests
        run: uv run --frozen pytest -q

      # package.json has no dependencies - these are node --check and
      # node --test - so there is nothing to install first.
      - name: Frontend syntax and unit tests
        run: |
          npm run check
          npm test

  deploy:
    # Production waits for green. Broken code belongs on dev, not here.
    needs: check
    uses: ./.github/workflows/_deploy.yml
    with:
      deploy_dir: ${{ vars.DEPLOY_DIR || '/opt/betterchat' }}
      instance: production
